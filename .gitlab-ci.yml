# Publica la documentación como sitio en GitLab Pages.
#
# GitLab sirve lo que el job deje en public/ (site_dir en mkdocs.yml).
#
# Visibilidad: por defecto, en un proyecto privado el sitio solo lo ven sus
# miembros —una visita anónima recibe 403—. Para abrirlo:
#   Settings -> General -> Visibility -> Pages -> Everyone

pages:
  stage: deploy
  image: python:3.12-slim
  variables:
    # Los plugins de fecha y autoría leen la historia de git. Con el clon
    # superficial por defecto (profundidad 1) no verían ninguna revisión y
    # todas las páginas saldrían con la fecha del build.
    GIT_DEPTH: 0
  script:
    - pip install --no-cache-dir -r docs/requirements.txt
    # --strict convierte los avisos en errores: un enlace roto tumba el job en
    # vez de publicarse. En documentación de compliance, un enlace que no lleva
    # a ninguna parte es peor que un job en rojo.
    - mkdocs build --strict
  artifacts:
    paths:
      - public
  # Corre en cada push a main, sin filtrar por ficheros. Se probó un filtro
  # `changes:` sobre docs/ y el job no llegaba a crearse: el pipeline salía
  # verde con cero jobs, que es indistinguible de haber publicado. Tarda 22
  # segundos; no vale la pena arriesgarse a un silencio así por ahorrarlos.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

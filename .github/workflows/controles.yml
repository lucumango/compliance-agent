# Controles automáticos en cada push y en cada pull request.
#
# Lo que NO está aquí, y es deliberado: `rag.eval` y `rag.eval_prompt`. Los dos
# llaman al modelo, así que necesitarían una GOOGLE_API_KEY como secreto del
# repositorio y consumirían cuota en cada push. Se ejecutan en local antes de
# desplegar, y está escrito en docs/MANTENIMIENTO.md.
#
# Lo que sí cabe aquí es todo lo que es determinista y gratis: lint, auditoría
# de dependencias, calidad del corpus ya parseado, y que el frontend y la
# documentación construyan.

name: Controles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      # Falla si alguna dependencia de RUNTIME tiene una vulnerabilidad
      # conocida. Las versiones van con rango (`>=`), así que un despliegue
      # nuevo trae lo que haya ese día: sin esto nadie se entera.
      - name: Vulnerabilidades de las dependencias
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner off

      # No llama al modelo: lee data/parsed/, que va versionado.
      - name: Calidad del corpus
        working-directory: backend
        run: python -m ingestion.validate

      # Recuperación por agente y, sobre todo, que cada artículo citado por el
      # cuestionario de DIEGO exista en el índice. Sin --alcance: esa parte
      # llama al modelo.
      - name: Agentes
        working-directory: backend
        run: python -m agentes.evaluar
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Vulnerabilidades de las dependencias
        working-directory: frontend
        # Solo las de producción: las de desarrollo no llegan al navegador de
        # nadie. `--audit-level=high` para que un aviso menor no bloquee.
        run: npm audit --omit=dev --audit-level=high

      # El build falla por cosas que `npm run dev` no ve — una colisión de
      # mayúsculas en un nombre de fichero, por ejemplo. Ya pasó una vez.
      - name: Construir
        working-directory: frontend
        run: npm run build

  documentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Los plugins de fecha y autoría leen la historia de git. Con el clon
          # superficial por defecto todas las páginas saldrían con la fecha del
          # build.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r docs/requirements.txt

      # --strict convierte los avisos en errores: un enlace roto tumba el job
      # en vez de publicarse. En documentación de compliance, un enlace que no
      # lleva a ninguna parte es peor que un job en rojo.
      - name: Construir la documentación
        run: mkdocs build --strict
